<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e3a63"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background Base / Calendar Shadow -->
  <rect x="6" y="8" width="52" height="50" rx="10" fill="#0f172a" opacity="0.1"/>
  
  <!-- Calendar Body -->
  <rect x="6" y="6" width="52" height="50" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Calendar Top Header -->
  <path d="M 6 16 C 6 10.477 10.477 6 16 6 L 48 6 C 53.523 6 58 10.477 58 16 L 58 20 L 6 20 Z" fill="url(#headerGrad)"/>
  
  <!-- Binder Rings -->
  <rect x="16" y="2" width="4" height="8" rx="2" fill="#e2e8f0"/>
  <rect x="44" y="2" width="4" height="8" rx="2" fill="#e2e8f0"/>

  <!-- Medical Cross Badge / Icon -->
  <circle cx="32" cy="36" r="14" fill="url(#badgeGrad)"/>
  <rect x="30" y="27" width="4" height="18" rx="2" fill="#ffffff"/>
  <rect x="23" y="34" width="18" height="4" rx="2" fill="#ffffff"/>

  <!-- Calendar Grid Dots -->
  <circle cx="15" cy="27" r="2" fill="#cbd5e1"/>
  <circle cx="49" cy="27" r="2" fill="#cbd5e1"/>
  <circle cx="15" cy="45" r="2" fill="#cbd5e1"/>
  <circle cx="49" cy="45" r="2" fill="#cbd5e1"/>
</svg>
